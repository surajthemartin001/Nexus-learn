<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="nexusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background with subtle rounded shape -->
  <rect width="512" height="512" rx="128" fill="#090d16" />
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="url(#nexusGrad)" stroke-width="4" stroke-opacity="0.4" fill="url(#glowGrad)" />

  <!-- Core Icon: Interlocking Knowledge Polyhedron / Open Book / Brain Nexus -->
  <g filter="url(#shadow)" transform="translate(64, 64) scale(0.75)">
    <!-- Central Hexagonal Neural Core -->
    <path d="M256 70 L410 160 L410 352 L256 442 L102 352 L102 160 Z" stroke="url(#nexusGrad)" stroke-width="20" stroke-linejoin="round" fill="#0f172a" fill-opacity="0.8" />
    <!-- Quantum Knowledge Strands -->
    <path d="M256 70 L256 442" stroke="url(#nexusGrad)" stroke-width="14" stroke-linecap="round" />
    <path d="M102 160 L410 352" stroke="url(#nexusGrad)" stroke-width="12" stroke-dasharray="8 8" opacity="0.7" />
    <path d="M410 160 L102 352" stroke="url(#nexusGrad)" stroke-width="12" stroke-dasharray="8 8" opacity="0.7" />
    <!-- Core Spark / Diamond -->
    <polygon points="256,180 320,256 256,332 192,256" fill="url(#nexusGrad)" />
    <circle cx="256" cy="70" r="16" fill="#38bdf8" />
    <circle cx="410" cy="160" r="16" fill="#818cf8" />
    <circle cx="410" cy="352" r="16" fill="#c084fc" />
    <circle cx="256" cy="442" r="16" fill="#38bdf8" />
    <circle cx="102" cy="352" r="16" fill="#818cf8" />
    <circle cx="102" cy="160" r="16" fill="#c084fc" />
    <circle cx="256" cy="256" r="22" fill="#ffffff" />
  </g>
</svg>
